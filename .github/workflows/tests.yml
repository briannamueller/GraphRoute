name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Exercise the advertised installation path, including the classification
      # calibration enabled by the default configuration.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Run tests
        run: pytest -q

      # The README points people at this one; run it so it cannot rot.
      - name: Run the quickstart example
        run: OMP_NUM_THREADS=1 python quickstart.py

      - name: Check the experiment runner
        run: python run_experiments.py --help

  package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and validate distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      - name: Install and import the wheel
        run: |
          python -m venv /tmp/graphroute-wheel-smoke
          /tmp/graphroute-wheel-smoke/bin/python -m pip install --upgrade pip
          /tmp/graphroute-wheel-smoke/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/graphroute-wheel-smoke/bin/python -c "import graphroute; from graphroute.config import GraphRouteConfig; from graphroute.experiment import load_experiments; from graphroute.run import fit_graphroute"
